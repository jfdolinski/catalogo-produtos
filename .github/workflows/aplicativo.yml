# Gera o APK do aplicativo de celular (pasta app/) e publica como Release do GitHub.
# Quem coloca no ar é deploy/publicar-app.ps1, que copia o APK da Release para o servidor (/downloads).
# - Sem o segredo APP_KEYSTORE_BASE64, o APK é de TESTE: assinado com a chave pública de depuração.
# - Com ele, é o de produção. A mesma chave é obrigatória em todas as versões (app/README.md).
# Também instala o APK num emulador Android e confere que ele abre sem travar.
name: Aplicativo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/aplicativo.yml']

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}

jobs:
  apk:
    # Versão fixa: o emulador e o Android SDK dependem da imagem.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Gera o projeto Android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: npx expo prebuild -p android --no-install

      - name: Compila
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Assina
        env:
          KEYSTORE: ${{ secrets.APP_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.APP_KEYSTORE_SENHA }}
        run: |
          set -e
          apk=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p saida
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > /tmp/chave.p12
            bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$bt/apksigner" sign --ks /tmp/chave.p12 --ks-type PKCS12 --ks-pass env:SENHA --out saida/catalogo-app.apk "$apk"
            rm -f /tmp/chave.p12
            "$bt/apksigner" verify --print-certs saida/catalogo-app.apk | head -3
            echo "PRERELEASE=" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem APP_KEYSTORE_BASE64: APK de TESTE, assinado com a chave de depuração."
            cp "$apk" saida/catalogo-app.apk
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
          node -p "require('./package.json').version" > saida/app-versao.txt
          echo "VERSAO=$(cat saida/app-versao.txt)" >> "$GITHUB_ENV"
          echo "TAMANHO=$(du -m saida/catalogo-app.apk | cut -f1)" >> "$GITHUB_ENV"
          (cd saida && sha256sum catalogo-app.apk > catalogo-app.apk.sha256)

      # A máquina de repositório privado tem disco pequeno: o emulador não sobe com a compilação ocupando espaço.
      # O APK já está em saida/; o que é da compilação e ferramentas que o emulador não usa podem sair.
      - name: Libera espaço para o emulador
        run: |
          df -h / | tail -1
          rm -rf android node_modules ~/.gradle
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules "$ANDROID_HOME/ndk"
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Habilita o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abre no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: app
          script: bash scripts/conferir-no-emulador.sh saida/catalogo-app.apk

      - name: Publica como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-$VERSAO-$VERSION_CODE"
          gh release create "$tag" saida/* --target "$GITHUB_SHA" $PRERELEASE --title "Aplicativo $VERSAO ($VERSION_CODE)" \
            --notes "APK de $TAMANHO MB. Para colocar no ar: deploy/publicar-app.ps1 -Tag $tag"
          echo "::notice title=Release::$tag"
