<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consulta de Produtos</title>
  <link rel="stylesheet" href="/admin/style.css">
  <style>
    body { background: var(--bg); }
    .cq { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    .cq-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .cq-head h1 { margin: 0; font-size: 22px; }
    .cq-search { display: flex; gap: 8px; margin-bottom: 8px; }
    .cq-search input { font-size: 16px; padding: 10px 12px; }
    .cq-search button { padding: 10px 18px; font-size: 15px; }
    .cq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
    .cq-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
    .cq-card:hover { border-color: var(--accent); }
    .cq-img { aspect-ratio: 1; background: #fff; display: grid; place-items: center; border-bottom: 1px solid var(--border); }
    .cq-img img { width: 100%; height: 100%; object-fit: contain; }
    .cq-img .none { color: #8a92a3; font-size: 13px; }
    .cq-body { padding: 10px 12px 12px; display: grid; gap: 4px; }
    .cq-name { font-weight: 600; line-height: 1.3; }
    .cq-codes code { font-size: 12px; margin-right: 6px; }
    .cq-msg { margin-top: 16px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="cq">
    <div class="cq-head">
      <h1>Consulta de produtos</h1>
      <a href="/" class="small">Acesso restrito (login) →</a>
    </div>
    <form id="f" class="cq-search" autocomplete="off">
      <input id="q" type="search" placeholder="Código de barras, nome, marca ou categoria" autofocus>
      <button class="primary">Consultar</button>
    </form>
    <div class="muted small">Leia o código de barras com o leitor ou digite. Mostra somente produtos ativos do catálogo.</div>
    <div id="msg" class="cq-msg"></div>
    <div id="grid" class="cq-grid"></div>
  </main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (s) => document.querySelector(s);

    async function search(q) {
      $('#msg').textContent = 'Consultando…';
      $('#grid').innerHTML = '';
      try {
        const r = await fetch(`/api/consulta?q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `Erro ${r.status}`);
        $('#msg').textContent = d.items.length
          ? (d.total > d.items.length ? `${d.total} produtos encontrados; mostrando os ${d.items.length} primeiros. Refine a busca.` : `${d.total} produto(s) encontrado(s).`)
          : 'Nenhum produto encontrado.';
        $('#grid').innerHTML = d.items.map((p) => `
          <a class="cq-card" href="${esc(p.page)}" target="_blank" rel="noopener">
            <div class="cq-img">${p.images[0] ? `<img src="${esc(p.images[0])}" alt="" loading="lazy">` : '<span class="none">sem foto</span>'}</div>
            <div class="cq-body">
              <div class="cq-name">${esc(p.name)}</div>
              ${p.brand || p.unit ? `<div class="muted small">${esc([p.brand, p.unit].filter(Boolean).join(' · '))}</div>` : ''}
              ${p.category ? `<div class="muted small">${esc(p.category)}</div>` : ''}
              <div class="cq-codes">${p.barcodes.map((c) => `<code>${esc(c)}</code>`).join('')}</div>
              ${p.actives.length ? `<div class="small">${p.actives.map(esc).join(' + ')}</div>` : ''}
              ${p.main_image_ai ? '<div class="muted small">imagem ilustrativa (IA)</div>' : ''}
              ${p.pending ? '<div class="small" style="color:var(--warn)">cadastro em atualização</div>' : ''}
            </div>
          </a>`).join('');
      } catch (e) {
        $('#msg').textContent = e.message;
      }
    }

    $('#f').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = $('#q').value.trim();
      if (!q) return;
      history.replaceState(null, '', `?q=${encodeURIComponent(q)}`);
      search(q);
      $('#q').select();
    });
    const initial = new URLSearchParams(location.search).get('q');
    if (initial) { $('#q').value = initial; search(initial); }
  </script>
</body>
</html>
